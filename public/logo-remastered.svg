<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Left Pillar Gradient (Cyan to Sky Blue) -->
    <linearGradient id="leftPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Right Pillar Gradient (Deep Navy to Petroleum Blue) -->
    <linearGradient id="rightPillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Checkmark Dynamic Gradient (Electric Indigo to Vivid Cyan) -->
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Drop Shadows for 3D Depth -->
    <filter id="shadowPillars" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.28" />
    </filter>

    <filter id="shadowCheck" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="12" flood-color="#070d18" flood-opacity="0.45" />
    </filter>

    <!-- Subtle Bevel Highlight Filter -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Group for Logo Geometry -->
  <g transform="translate(10, 10)">
    <!-- Base Background Subtle Glow / Soft container (Optional backdrop) -->
    
    <!-- LEFT PILLAR OF 'M': Rounded squircle block with central notch -->
    <!-- Left wing: starts top-left, curves down to bottom, cuts inward -->
    <path d="M 70 120 
             C 70 100, 85 85, 105 85 
             L 190 85 
             C 200 85, 210 90, 215 100 
             L 240 148 
             L 240 370 
             C 240 395, 220 415, 195 415 
             L 105 415 
             C 85 415, 70 400, 70 380 
             Z" 
          fill="url(#leftPillarGrad)" 
          filter="url(#shadowPillars)" />

    <!-- Left Pillar Gloss Highlight -->
    <path d="M 72 120 
             C 72 102, 86 87, 105 87 
             L 190 87 
             C 198 87, 206 91, 211 98 
             L 236 148 
             L 236 210 
             L 72 210 
             Z" 
          fill="url(#glossHighlight)" />

    <!-- RIGHT PILLAR OF 'M': Symmetrical squircle block in deep navy -->
    <path d="M 240 148 
             L 265 100 
             C 270 90, 280 85, 290 85 
             L 375 85 
             C 395 85, 410 100, 410 120 
             L 410 380 
             C 410 400, 395 415, 375 415 
             L 285 415 
             C 260 415, 240 395, 240 370 
             Z" 
          fill="url(#rightPillarGrad)" 
          filter="url(#shadowPillars)" />

    <!-- Subtle Right Pillar Gloss -->
    <path d="M 244 148 
             L 267 102 
             C 272 93, 281 87, 290 87 
             L 375 87 
             C 393 87, 408 102, 408 120 
             L 408 210 
             L 244 210 
             Z" 
          fill="url(#glossHighlight)" />

    <!-- Central Chevron V-Cut Divider (Precision Crisp Separation) -->
    <path d="M 195 85 L 240 170 L 285 85 Z" fill="#070d18" opacity="0.12" />

    <!-- THE ICONIC CHECKMARK: Sleek, Aerodynamic & Sharp Nike/Fintech style -->
    <!-- Starts from left-center, dips to sharp check apex, shoots out past the top-right -->
    <path d="M 175 285 
             C 190 310, 210 350, 228 385 
             C 232 393, 237 400, 242 400 
             C 247 400, 252 392, 258 380 
             C 295 295, 360 160, 445 42 
             C 450 36, 448 30, 440 34 
             C 345 145, 280 260, 243 335 
             C 230 310, 215 285, 195 265 
             C 188 258, 180 262, 175 272 
             C 173 276, 174 281, 175 285 
             Z" 
          fill="url(#checkGrad)" 
          filter="url(#shadowCheck)" />

    <!-- Inner Glow Accent on the checkmark tip -->
    <path d="M 330 170 C 375 105, 420 55, 444 38 C 440 46, 405 105, 360 175 Z" fill="#ffffff" opacity="0.45" />
  </g>
</svg>
